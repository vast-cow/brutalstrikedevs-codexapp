name: Distribution compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        npm: ['10.9.9', '11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_SPEC: github:${{ github.repository }}#${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select npm version
        run: npm install --global "npm@${{ matrix.npm }}"
      - name: Check distribution contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pack] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'pack.json')));
          const files = new Set(pack.files.map(file => file.path));
          for (const file of ['dist/index.html', 'dist-cli/index.js', 'scripts/fix-pty-native-build.cjs']) {
            assert(files.has(file), `Missing ${file}`);
          }
          assert([...files].some(file => /^dist\/assets\/.*\.js$/.test(file)));
          const pkg = JSON.parse(readFileSync('package.json'));
          assert.equal(pkg.devDependencies, undefined);
          for (const hook of ['build', 'prepare', 'prepack', 'preinstall', 'install', 'postinstall', 'prepublishOnly']) {
            assert.equal(pkg.scripts?.[hook], undefined, `Unexpected ${hook} hook`);
          }
          NODE
      - name: Run CLI from the tested GitHub commit
        working-directory: ${{ runner.temp }}
        run: npx --yes --package="$PACKAGE_SPEC" codexapp --help
      - name: Install the tested GitHub commit
        run: npm install --prefix "$RUNNER_TEMP/distribution" --no-audit --no-fund "$PACKAGE_SPEC"
      - name: Check HTTP and integrated terminal
        run: node scripts/smoke-distribution.mjs "$RUNNER_TEMP/distribution/node_modules/@brutalstrikedevs/codexapp"
